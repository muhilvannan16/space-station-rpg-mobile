name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/ci-constraints.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential ccache cmake gettext git \
            libffi-dev libltdl-dev libssl-dev libtool openjdk-17-jdk \
            patch pkg-config python3-pip python3-setuptools python3-venv \
            unzip zip zlib1g-dev

      - name: Install Buildozer
        run: pip install --upgrade "Cython<3.0" https://github.com/kivy/buildozer/archive/master.zip

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          mkdir -p ~/.config/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "$KEYSTORE_B64" | base64 -d > ~/.config/.android/debug.keystore
            echo "Keystore restored to both locations:"
            ls -la ~/.android/debug.keystore ~/.config/.android/debug.keystore
          else
            echo "WARNING: DEBUG_KEYSTORE_B64 secret is empty or not set!"
          fi

      - name: Build with Buildozer
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-station-rpg-debug
          path: bin/*.apk